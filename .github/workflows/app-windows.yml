# Costruisce l'app per Windows (installatore .exe) con Tauri, partendo dalla stessa index.html del sito.
# L'installatore si scarica dalla pagina dell'esecuzione, nella sezione «Artifacts».
name: App per Windows

on:
  push:
    branches: [main]
    paths: ['index.html', 'app/**', '.github/workflows/app-windows.yml']
  pull_request:
    paths: ['index.html', 'app/**', '.github/workflows/app-windows.yml']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Copia la pagina del calcolatore nell'app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force app/dist | Out-Null
          Copy-Item index.html app/dist/index.html

      - name: Costruisci l'installatore
        working-directory: app
        run: npx --yes @tauri-apps/cli@2 build

      - uses: actions/upload-artifact@v4
        with:
          name: Atelier-Liquidi-per-Windows
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
