<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{--ink:#1f2d3d;--muted:#5f6b78;--paper:#f4f2ec;--card:#fffefa;--blue:#1f3550;--blue2:#2c4d73;--soft:#e8edf3;--red:#b52b3b;--redsoft:#f7e5e4;--green:#2f6b4f;--greensoft:#e3efe7;--amber:#8a5a00;--ambersoft:#fbf0d9;--line:#dde2e8}
*{box-sizing:border-box}html{scrollbar-gutter:stable}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Segoe UI",Calibri,Arial,sans-serif;font-size:15px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:#f0f3f6;border:1px solid transparent;border-radius:8px;padding:7px 10px;min-height:38px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue2);outline-offset:1px;background:#fff}
input.num{width:84px;text-align:right;font-variant-numeric:tabular-nums}input.money{width:110px;text-align:right;font-variant-numeric:tabular-nums}
button{cursor:pointer;border:0;border-radius:8px;min-height:38px;padding:7px 14px;font-weight:650;background:var(--soft);color:var(--blue)}
button:hover{filter:brightness(.96)}button:focus-visible{outline:2px solid var(--red);outline-offset:2px}button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--blue);color:#fff}button.danger{background:var(--redsoft);color:#922637}button.ghost{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}button.small{min-height:30px;padding:4px 10px;font-size:13px}
header.top{background:var(--blue);color:#fff;padding:14px 24px 0}
.top-row{max-width:1400px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}.brand-mark{width:44px;height:44px;border-radius:8px;background:#11202f;display:grid;place-items:center;font-family:Georgia,serif;font-size:30px;font-weight:700;color:#fff;box-shadow:inset 0 0 0 2px #ffffff33}
.brand h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:26px;line-height:1.1}.brand p{margin:0;font-size:12px;color:#c9d6e4;letter-spacing:.5px}
.status{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px}.chip{padding:6px 12px;border-radius:30px;font-weight:650;font-size:13px;background:#ffffff1c}.chip.open{background:#cfe9d9;color:#17402c}.chip.closed{background:#f3d3d6;color:#6e1a26}.chip.holiday{background:#fbe6b8;color:#5a3b00}
.clock{font-variant-numeric:tabular-nums;color:#dfe8f1}
nav.tabs{max-width:1400px;margin:12px auto 0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin}
nav.tabs a{color:#dfe8f1;text-decoration:none;padding:10px 14px;border-radius:10px 10px 0 0;font-weight:650;font-size:14px;white-space:nowrap}nav.tabs a:hover{background:#ffffff14}nav.tabs a.active{background:var(--paper);color:var(--blue)}
nav.tabs .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;text-align:center;line-height:18px}
main{max-width:1400px;margin:0 auto;padding:22px 24px 80px}
h2{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:26px;margin:0 0 4px}h3{font-size:16px;margin:0 0 10px;color:var(--blue)}
.intro{color:var(--muted);margin:0 0 18px;max-width:900px}
.card{background:var(--card);border-radius:14px;padding:18px;box-shadow:0 3px 16px #1f2d3d08;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row.end{justify-content:flex-end}.spacer{flex:1}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}.field input,.field select,.field textarea{color:var(--ink);font-weight:400;font-size:15px}
.note{font-size:13px;color:var(--muted);margin:6px 0 0}.warn{color:var(--red);font-weight:600}.ok{color:var(--green);font-weight:600}
.reparti{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:14px}
.reparti button{min-height:58px;background:#f0f3f6;color:var(--ink);text-align:left;padding:8px 12px;font-size:14px;line-height:1.2;display:flex;align-items:center;gap:8px}
.reparti button .ico{font-size:20px}.reparti button.sel{background:var(--blue);color:#fff}.reparti button.neg{background:var(--ambersoft)}.reparti button.neg.sel{background:var(--amber);color:#fff}
.linea{background:#f6f8fa;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.suggest-wrap{position:relative;flex:1 1 260px}.suggest-wrap input{width:100%}
.suggest{position:absolute;left:0;right:0;top:100%;margin:4px 0 0;padding:4px;list-style:none;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 24px #1f2d3d22;z-index:30;max-height:300px;overflow:auto}.suggest[hidden]{display:none}
.suggest li{padding:7px 10px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}.suggest li:hover,.suggest li.active{background:var(--soft)}.suggest li small{color:var(--muted)}
.conto{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.conto-line{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}.conto-line .d{flex:1}.conto-line .a{font-variant-numeric:tabular-nums;font-weight:650;white-space:nowrap}
.totale{display:flex;justify-content:space-between;align-items:baseline;margin:10px 0}.totale strong{font-family:Georgia,serif;font-size:32px;font-weight:400}
.pay{display:flex;gap:6px;flex-wrap:wrap}.pay label{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:8px;background:#f0f3f6;cursor:pointer;font-weight:600;font-size:14px}.pay input{min-height:0}.pay label:has(input:checked){background:var(--blue);color:#fff}
.alert{padding:10px 12px;border-radius:10px;margin:0 0 8px;font-size:14px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}.alert.info{background:var(--soft)}.alert.warn{background:var(--redsoft);color:#7d1f2d;font-weight:400}.alert.amber{background:var(--ambersoft);color:#5a3b00}.alert.good{background:var(--greensoft);color:#17402c}
.alert a{color:inherit;font-weight:650}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.kpi{background:#f6f8fa;border-radius:10px;padding:10px 12px}.kpi span{display:block;font-size:12px;color:var(--muted);font-weight:600}.kpi b{font-size:21px;font-weight:600;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;font-size:12px;color:var(--blue);font-weight:700;letter-spacing:.3px;padding:6px 6px;border-bottom:2px solid var(--line);white-space:nowrap}td{padding:6px;border-bottom:1px solid var(--line);vertical-align:middle}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}tr.low td{background:#fdf2f2}tr.muted td{color:var(--muted)}
.table-wrap{overflow-x:auto}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:10px;background:var(--soft);color:var(--blue);white-space:nowrap}.tag.red{background:var(--redsoft);color:#922637}.tag.green{background:var(--greensoft);color:var(--green)}.tag.amber{background:var(--ambersoft);color:var(--amber)}
.small{font-size:12px;color:var(--muted)}
dialog{width:min(820px,calc(100vw - 24px));max-height:calc(100vh - 40px);border:0;border-radius:16px;padding:0;background:var(--card);color:var(--ink);box-shadow:0 20px 60px #1f2d3d55}dialog::backdrop{background:#1f2d3d99}
.dlg-head{position:sticky;top:0;background:var(--card);display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);z-index:2}.dlg-head h3{margin:0;font-size:19px}.dlg-body{padding:16px 20px 20px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:30px;font-size:14px;box-shadow:0 8px 24px #0004;z-index:100;opacity:0;transition:opacity .2s;pointer-events:none}.toast.show{opacity:1}
.empty{color:var(--muted);font-style:italic;margin:8px 0}
.conto-reg{border-bottom:1px solid var(--line);padding:8px 0}.conto-reg .h{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13px;color:var(--muted)}.conto-reg .h b{color:var(--ink);font-size:15px;font-variant-numeric:tabular-nums}.conto-reg ul{margin:3px 0 0;padding-left:18px;font-size:13px}
footer.foot{max-width:1400px;margin:0 auto;padding:0 24px 30px;font-size:11px;color:var(--muted)}
.print-only{display:none}
@media(max-width:1000px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
@media(max-width:640px){header.top{padding:12px 14px 0}main{padding:16px 12px 80px}.brand h1{font-size:22px}.clock{display:none}input.num{width:66px}}
@media print{@page{size:A4;margin:12mm}body{background:#fff}header.top,nav,footer.foot,.no-print,button{display:none!important}main{padding:0;max-width:none}.card{box-shadow:none;padding:0}.print-only{display:block}input{background:none;border:0;padding:0;min-height:0}}
</style></head>
<body>
<header class="top">
 <div class="top-row">
  <div class="brand"><span class="brand-mark" aria-hidden="true">T</span><div><p>GESTIONE DEL NEGOZIO</p><h1 id="nome-negozio">Tabaccheria</h1></div></div>
  <div class="status"><span id="stato-negozio" class="chip"></span><span class="clock" id="orologio"></span></div>
 </div>
 <nav class="tabs" id="tabs"></nav>
</header>
<main id="main"></main>
<footer class="foot">I dati restano su questo computer, nel browser. Fai spesso una copia di sicurezza (Impostazioni → Copia di sicurezza). · Prezzi dei tabacchi dal listino ufficiale ADM, scaricato da tabaccai.it · <span id="versione">Versione 1.0 · 19/10/2026</span></footer>
<dialog id="dlg"><div class="dlg-head"><h3 id="dlg-title"></h3><button class="ghost small" data-act="dlg-close" aria-label="Chiudi">✕</button></div><div class="dlg-body" id="dlg-body"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="listino.js"></script>
<script>
'use strict';
/* ============ Utilità ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const EUR = new Intl.NumberFormat('it-IT', {style:'currency', currency:'EUR'});
const eur = c => EUR.format((c || 0) / 100);
const cents = v => { let s = String(v ?? '').trim().replace(/[€\s]/g, ''); if (!s) return null; if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.'); const n = parseFloat(s); return isFinite(n) ? Math.round(n * 100) : null; };
const euroIn = c => c == null ? '' : (c / 100).toFixed(2).replace('.', ',');
const int = v => { const n = parseInt(String(v ?? '').trim(), 10); return isFinite(n) ? n : null; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const dayKey = d => { d = new Date(d); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const today = () => dayKey(new Date());
const fmtDate = k => { if (!k) return ''; const [y, m, d] = k.slice(0, 10).split('-'); return d + '/' + m + '/' + y; };
const fmtTime = t => { const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const addDays = (k, n) => { const d = new Date(k + 'T12:00:00'); d.setDate(d.getDate() + n); return dayKey(d); };
const GIORNI = ['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'];
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
let toastTimer;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600); }

/* ============ Reparti della cassa ============ */
const REPARTI = [
 {id:'tabacchi', nome:'Tabacchi', ico:'🚬', tipo:'tabacchi'},
 {id:'gratta', nome:'Gratta e vinci', ico:'🎟️', tipo:'gratta'},
 {id:'lotto', nome:'Lotto e giochi', ico:'🍀', tipo:'libero', aggio:'lotto', voci:['Lotto','10eLotto','SuperEnalotto','Million Day','Altro gioco']},
 {id:'ricariche', nome:'Ricariche', ico:'📱', tipo:'libero', aggio:'ricariche', voci:['TIM','Vodafone','WindTre','Iliad','Ho.','Kena','Very Mobile','PostePay','Carta prepagata','Altro']},
 {id:'servizi', nome:'Pagamenti e servizi', ico:'🧾', tipo:'servizi', voci:['Bollettino','PagoPA','Bollo auto','Bolletta','Multa','Spedizione','Altro servizio']},
 {id:'copie', nome:'Fotocopie e stampe', ico:'🖨️', tipo:'copie'},
 {id:'accessori', nome:'Accendini e cartine', ico:'🔥', tipo:'articoli'},
 {id:'batterie', nome:'Batterie', ico:'🔋', tipo:'articoli'},
 {id:'cancelleria', nome:'Cancelleria', ico:'✏️', tipo:'articoli'},
 {id:'snack', nome:'Patatine e caramelle', ico:'🍬', tipo:'articoli'},
 {id:'sale', nome:'Sale', ico:'🧂', tipo:'articoli'},
 {id:'cartoline', nome:'Cartoline', ico:'✉️', tipo:'articoli'},
 {id:'altro', nome:'Altro', ico:'➕', tipo:'libero'},
 {id:'vincite', nome:'Vincita pagata', ico:'💶', tipo:'libero', negativo:true, voci:['Gratta e vinci','Lotto','10eLotto','Altro']}
];
const REP = Object.fromEntries(REPARTI.map(r => [r.id, r]));
const REP_ARTICOLI = REPARTI.filter(r => r.tipo === 'articoli');
const PAGAMENTI = {contanti:'Contanti', carta:'Carta / bancomat', libretto:'Sul libretto', distributore:'Distributore 24h'};

/* ============ Dati ============ */
const KEY = 'tabaccheria.dati.v1', LKEY = 'tabaccheria.listino.v1';
function defaults() {
 const a = (nome, rep) => ({id:uid(), nome, rep, prezzo:null, costo:null, scorta:0, minimo:0});
 return {
  versione:1,
  negozio:{nome:'Tabaccheria di Forme', orari:[['09:30','13:00'],['16:30','20:00']], chiusoGiorni:[], ferie:[], giornoOrdine:1, giornoConsegna:3,
   prezzoCopia:15, prezzoStampa:20, aggi:{tabacchi:10, gratta:8, lotto:8, ricariche:3}, ultimoBackup:null, creato:new Date().toISOString()},
  assortimento:{}, articoli:[
   a('Pile AA stilo (conf. 4)','batterie'), a('Pile AAA ministilo (conf. 4)','batterie'), a('Pila a bottone CR2032','batterie'), a('Pila a bottone CR2025','batterie'), a('Pila a bottone LR44','batterie'),
   a('Sale fino 1 kg','sale'), a('Sale grosso 1 kg','sale'),
   a('Patatine','snack'), a('Caramelle','snack'), a('Gomme da masticare','snack'),
   a('Accendino','accessori'), a('Cartine','accessori'), a('Filtri','accessori'),
   a('Penna a sfera','cancelleria'), a('Quaderno','cancelleria'), a('Busta da lettera','cancelleria'), a('Francobollo','cancelleria'),
   a('Cartolina','cartoline')],
  movimenti:[], libretto:[], clienti:[], ordini:[], gratta:[], promemoria:[]
 };
}
function load() {
 try { const raw = localStorage.getItem(KEY); if (raw) { const d = JSON.parse(raw); const def = defaults(); for (const k in def) if (d[k] == null) d[k] = def[k]; d.negozio = Object.assign(def.negozio, d.negozio); d.negozio.aggi = Object.assign(defaults().negozio.aggi, d.negozio.aggi); return d; } } catch (e) { console.error(e); }
 return defaults();
}
let D = load(), saveFailed = false;
function save() { try { localStorage.setItem(KEY, JSON.stringify(D)); saveFailed = false; } catch (e) { saveFailed = true; toast('Attenzione: non riesco a salvare i dati nel browser!'); } }

/* ============ Listino tabacchi ============ */
const CAT_BREVE = {'Sigarette':'Sigarette','Tabacco da inalazione senza combustione':'Stick da riscaldare','Trinciati per sigarette':'Trinciati','Sigari':'Sigari','Sigaretti':'Sigaretti','Altri Tabacchi da fumo':'Pipa e narghilè','Tabacco da fiuto o da mastico':'Fiuto e mastico'};
let LISTINO, byCode;
function loadListino() {
 let l = null;
 try { const raw = localStorage.getItem(LKEY); if (raw) l = JSON.parse(raw); } catch (e) {}
 LISTINO = l || window.LISTINO_BASE || {vigore:'', aggiornato:'', categorie:[], prodotti:[]};
 byCode = new Map();
 for (const p of LISTINO.prodotti) { const cat = LISTINO.categorie[p[0]]; byCode.set(String(p[1]), {cod:String(p[1]), cat, breve:CAT_BREVE[cat] || cat, nome:p[2], prezzo:Math.round(p[3] * 100), conf:p[4]}); }
}
loadListino();
const prodotto = cod => byCode.get(String(cod));
function prezzoTab(cod) { const p = prodotto(cod); if (p) return p.prezzo; const a = D.assortimento[cod]; return a ? a.prezzo : 0; }
function nomeTab(cod) { const p = prodotto(cod); if (p) return p.nome; const a = D.assortimento[cod]; return a ? a.nome : 'Codice ' + cod; }
function multiploPredefinito(cat) { return (cat === 'Sigarette' || cat === 'Tabacco da inalazione senza combustione') ? 10 : 1; }
function aggiungiAssortimento(cod) {
 const p = prodotto(cod); if (!p || D.assortimento[cod]) return;
 D.assortimento[cod] = {nome:p.nome, cat:p.cat, prezzo:p.prezzo, banco:0, distr:0, minimo:0, obiettivo:0, multiplo:multiploPredefinito(p.cat)};
}
function cercaListino(q, cat, limite = 40) {
 const t = norm(q).trim(); if (!t && !cat) return [];
 const out = [], parole = t.split(/\s+/).filter(Boolean);
 for (const p of byCode.values()) {
  if (cat && p.cat !== cat) continue;
  const n = norm(p.nome);
  if (parole.every(w => n.includes(w)) || p.cod === t) { out.push(p); }
 }
 out.sort((a, b) => (norm(b.nome).startsWith(t) - norm(a.nome).startsWith(t)) || a.nome.localeCompare(b.nome));
 return out.slice(0, limite);
}

/* ============ Orari, ferie, stato del negozio ============ */
const toMin = hhmm => { const [h, m] = String(hhmm || '0:0').split(':').map(Number); return h * 60 + (m || 0); };
function inFerie(k) { return D.negozio.ferie.find(f => f.dal <= k && k <= f.al); }
function apertoIl(k) { const g = new Date(k + 'T12:00:00').getDay(); return !inFerie(k) && !D.negozio.chiusoGiorni.includes(g); }
function statoNegozio(now = new Date()) {
 const k = dayKey(now), m = now.getHours() * 60 + now.getMinutes(), f = inFerie(k);
 const prossima = () => { for (let i = 0; i < 60; i++) { const kk = addDays(k, i); if (!apertoIl(kk)) continue; for (const [a] of D.negozio.orari) if (i > 0 || toMin(a) > m) return {k:kk, ora:a, i}; } return null; };
 const descr = p => !p ? '' : p.i === 0 ? 'alle ' + p.ora : p.i === 1 ? 'domani alle ' + p.ora : GIORNI[new Date(p.k + 'T12:00:00').getDay()] + ' ' + fmtDate(p.k).slice(0, 5) + ' alle ' + p.ora;
 if (f) return {cls:'holiday', testo:'In ferie' + (f.nota ? ' (' + f.nota + ')' : '') + ' · riapre ' + descr(prossima())};
 if (apertoIl(k)) for (const [a, c] of D.negozio.orari) if (m >= toMin(a) && m < toMin(c)) return {cls:'open', testo:'Aperto · chiude alle ' + c};
 return {cls:'closed', testo:'Chiuso · riapre ' + descr(prossima())};
}
function inizioSettimana(k) { const d = new Date(k + 'T12:00:00'); const g = (d.getDay() + 6) % 7; return addDays(k, -g); }

/* ============ Calcoli su vendite e scorte ============ */
const isVendita = m => !REP[m.rep]?.negativo;
function guadagnoStimato(m) {
 const ag = D.negozio.aggi, r = REP[m.rep];
 if (!r || r.negativo) return 0;
 if (m.rep === 'tabacchi') return Math.round(m.imp * ag.tabacchi / 100);
 if (m.rep === 'gratta') return Math.round(m.imp * ag.gratta / 100);
 if (r.aggio) return Math.round(m.imp * (ag[r.aggio] || 0) / 100);
 if (m.rep === 'servizi') return m.comm || 0;
 if (m.rep === 'copie') return m.imp;
 if (r.tipo === 'articoli') { const a = D.articoli.find(x => x.id === m.art); return a && a.costo != null && m.prezzoU != null ? (m.prezzoU - a.costo) * m.qta : null; }
 return null;
}
function venditeTabacco(cod, giorni = 28) { const da = addDays(today(), -giorni + 1); let q = 0; for (const m of D.movimenti) if (m.cod === cod && dayKey(m.t) >= da) q += m.qta; return q; }
function vendutiGratta(id) { let q = 0; for (const m of D.movimenti) if (m.gv === id) q += m.qta; return q; }
function saldoCliente(id) { return D.libretto.filter(x => x.cli === id).reduce((s, x) => s + x.imp, 0); }
const nomeCliente = id => D.clienti.find(c => c.id === id)?.nome || 'Cliente';
function proposta(cod) {
 const a = D.assortimento[cod], tot = a.banco + a.distr, mult = Math.max(1, a.multiplo || 1);

let periodo = {tipo:'oggi', da:today(), a:today()};
function calcPeriodo() {
 const k = today(), p = periodo;
 if (p.tipo === 'oggi') return [k, k];
 if (p.tipo === 'ieri') return [addDays(k, -1), addDays(k, -1)];
 if (p.tipo === 'settimana') return [inizioSettimana(k), k];
 if (p.tipo === 'mese') return [k.slice(0, 8) + '01', k];
 if (p.tipo === 'mesescorso') { const d = new Date(k.slice(0, 8) + '01T12:00:00'); d.setDate(0); const f = dayKey(d); return [f.slice(0, 8) + '01', f]; }
 if (p.tipo === 'anno') return [k.slice(0, 4) + '-01-01', k];
 return [p.da || k, p.a || k];
}

 return `<h2>Registro e conti</h2><p class="intro">Quanto è entrato, da dove, e una stima del guadagno con gli aggi impostati in Impostazioni.</p>
 <section class="card"><div class="row">${tipi.map(([k, l]) => `<button class="small ${periodo.tipo === k ? 'primary' : ''}" data-act="periodo" data-id="${k}">${l}</button>`).join('')}${periodo.tipo === 'libero' ? `<input type="date" id="p-da" value="${da}"><input type="date" id="p-a" value="${a}">` : ''}<span class="spacer"></span><button class="small" data-act="csv">Esporta in Excel (CSV)</button></div>

 ${r.guadagnoParziale ? '<p class="note">* manca il costo d’acquisto di qualche articolo: imposta i costi in Altri articoli per una stima completa.</p>' : ''}</section>
 <div class="grid2" style="margin-top:18px"><section class="card"><h3>Per reparto</h3><table><thead><tr><th>Reparto</th><th class="n">Pezzi</th><th class="n">Importo</th><th class="n">Guadagno stimato</th></tr></thead><tbody>${REPARTI.filter(x => r.rep[x.id]).map(x => `<tr><td>${x.ico} ${x.nome}</td><td class="n">${r.rep[x.id].qta}</td><td class="n">${eur(r.rep[x.id].imp)}</td><td class="n">${x.negativo ? '' : eur(r.rep[x.id].g)}</td></tr>`).join('') || '<tr><td colspan="4" class="empty">Nessun movimento.</td></tr>'}</tbody></table>
 ${top.length ? `<h3 style="margin-top:18px">Tabacchi più venduti</h3><table><tbody>${top.map(([c, q]) => `<tr><td>${esc(nomeTab(c))}</td><td class="n">${q} pz</td></tr>`).join('')}</tbody></table>` : ''}</section>
 <section class="card"><h3>Conti (${conti.length})</h3>${conti.length ? conti.slice(0, 200).map(g => htmlContoReg(g, da !== a)).join('') : '<p class="empty">Nessun conto nel periodo.</p>'}${conti.length > 200 ? '<p class="note">Mostro gli ultimi 200: il file CSV li contiene tutti.</p>' : ''}</section></div>`;

function esportaCSV() {
 const [da, a] = calcPeriodo(), rows = [['Data','Ora','Reparto','Descrizione','Quantità','Importo','Commissione','Pagamento','Cliente','Consegnato fuori','Guadagno stimato']];
 for (const m of D.movimenti.filter(m => dayKey(m.t) >= da && dayKey(m.t) <= a).sort((x, y) => x.t.localeCompare(y.t))) { const g = guadagnoStimato(m); rows.push([fmtDate(dayKey(m.t)), fmtTime(m.t), REP[m.rep]?.nome, m.desc, m.qta, euroIn(m.imp), euroIn(m.comm || 0), PAGAMENTI[m.pag], m.cli ? nomeCliente(m.cli) : '', m.fuori ? 'sì' : '', g == null ? '' : euroIn(g)]); }
 scarica(`registro_${da}_${a}.csv`, '﻿' + rows.map(r => r.map(x => `"${String(x ?? '').replace(/"/g, '""')}"`).join(';')).join('\r\n'), 'text/csv');
}

function scarica(nome, testo, tipo) { const b = new Blob([testo], {type:tipo}), u = URL.createObjectURL(b), a = document.createElement('a'); a.href = u; a.download = nome; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 1000); }

/* ============ Aggiornamento del listino da file .xls ============ */
function dlgListino() {
 openDlg('Aggiorna il listino tabacchi', `<p class="intro">Scarica da <a href="https://www.tabaccai.it/" target="_blank" rel="noopener">tabaccai.it</a> l’elenco dei prezzi e caricalo qui:</p>
 <ul><li><b>Completo</b>: sostituisce tutto il listino; i prodotti radiati spariscono dalla ricerca.</li><li><b>Modificato</b>: aggiunge o aggiorna solo i prodotti cambiati.</li></ul>
 <p class="note">Per leggere i file .xls serve la connessione internet (una sola volta per caricamento).</p>
 <label class="field" style="margin-top:12px">File .xls<input type="file" id="file-listino" accept=".xls,.xlsx"></label><div id="esito-listino" style="margin-top:14px"></div>`);
 $('#file-listino').addEventListener('change', async e => { const f = e.target.files[0]; if (f) await importaListino(f); });
}
function caricaSheetJS() {
 if (window.XLSX) return Promise.resolve();
 return new Promise((ok, ko) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = ok; s.onerror = () => ko(new Error('Non riesco a scaricare il lettore di file Excel: controlla la connessione.')); document.head.appendChild(s); });
}
let listinoInArrivo = null;
async function importaListino(file) {
 const out = $('#esito-listino'); out.innerHTML = '<p>Leggo il file…</p>';
 try {
  await caricaSheetJS();
  const wb = XLSX.read(await file.arrayBuffer(), {type:'array'}), rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, defval:''});
  const hi = rows.findIndex(r => r.some(c => String(c).trim() === 'Codice')); if (hi < 0) throw new Error('Non trovo la colonna «Codice»: è il file giusto?');
  const H = rows[hi].map(c => String(c).trim()), ci = n => H.findIndex(h => h.startsWith(n));
  const iCat = ci('Categoria'), iCod = ci('Codice'), iNome = ci('Denominazione'), iPr = ci('Prezzo per confezione'), iConf = ci('Tipo di confezione');
  const testo = rows.slice(0, hi).flat().join(' '), vig = (testo.match(/in vigore dal ([0-9]{1,2} \w+ [0-9]{4})/i) || [])[1] || '', agg = rows.slice(0, hi).flat().find(c => /aggiornato al/i.test(c)) || '';
  const nuovi = [];
  for (const r of rows.slice(hi + 1)) { const cod = String(r[iCod]).trim().replace(/\.0$/, ''); const pr = typeof r[iPr] === 'number' ? r[iPr] : parseFloat(String(r[iPr]).replace(',', '.')); if (!cod || !isFinite(pr)) continue; nuovi.push({cat:String(r[iCat]).trim(), cod, nome:String(r[iNome]).trim(), prezzo:pr, conf:String(r[iConf]).trim().replace(/^Confezione /, '')}); }
  if (!nuovi.length) throw new Error('Il file non contiene prodotti.');
  const completo = nuovi.length > 1000, nuoviMap = new Map(nuovi.map(p => [p.cod, p]));
  const cambiati = [], aggiunti = [];
  for (const p of nuovi) { const v = byCode.get(p.cod); if (!v) aggiunti.push(p); else if (v.prezzo !== Math.round(p.prezzo * 100)) cambiati.push([v, p]); }
  const radiati = completo ? [...byCode.values()].filter(p => !nuoviMap.has(p.cod)) : [];
  listinoInArrivo = {completo, nuovi, vig, agg};
  const mio = c => D.assortimento[c] ? ' <span class="tag">tuo</span>' : '';
  out.innerHTML = `<div class="alert info"><span>File <b>${completo ? 'completo' : 'delle variazioni'}</b>: ${nuovi.length.toLocaleString('it-IT')} prodotti${vig ? ', in vigore dal ' + esc(vig.toLowerCase()) : ''}.</span></div>
  <p><b>${cambiati.length}</b> prezzi cambiati · <b>${aggiunti.length}</b> nuovi prodotti${completo ? ` · <b>${radiati.length}</b> radiati` : ''}</p>
  ${cambiati.length ? `<table><thead><tr><th>Prodotto</th><th class="n">Prima</th><th class="n">Ora</th></tr></thead><tbody>${cambiati.sort((a, b) => !!D.assortimento[b[0].cod] - !!D.assortimento[a[0].cod]).slice(0, 80).map(([v, p]) => `<tr><td>${esc(p.nome)}${mio(p.cod)}</td><td class="n">${eur(v.prezzo)}</td><td class="n"><b>${eur(Math.round(p.prezzo * 100))}</b></td></tr>`).join('')}</tbody></table>` : ''}
  ${aggiunti.length ? `<p class="note">Nuovi: ${aggiunti.slice(0, 30).map(p => esc(p.nome)).join(', ')}${aggiunti.length > 30 ? '…' : ''}</p>` : ''}
  ${radiati.filter(p => D.assortimento[p.cod]).length ? `<p class="warn">Del tuo assortimento non sono più in listino: ${radiati.filter(p => D.assortimento[p.cod]).map(p => esc(p.nome)).join(', ')}</p>` : ''}
  <div class="row end" style="margin-top:12px"><button class="primary" data-act="applica-listino">Applica il nuovo listino</button></div>`;
 } catch (err) { out.innerHTML = `<div class="alert warn">${esc(err.message || err)}</div>`; }
}
function applicaListino() {
 const x = listinoInArrivo; if (!x) return;
 const cats = x.completo ? [] : [...LISTINO.categorie], prodotti = x.completo ? [] : LISTINO.prodotti.filter(p => !x.nuovi.some(n => n.cod === String(p[1])));
 for (const p of x.nuovi) { let i = cats.indexOf(p.cat); if (i < 0) { cats.push(p.cat); i = cats.length - 1; } prodotti.push([i, p.cod, p.nome, p.prezzo, p.conf]); }
 const nuovo = {vigore:x.vig || LISTINO.vigore, aggiornato:x.agg || LISTINO.aggiornato, categorie:cats, prodotti};
 try { localStorage.setItem(LKEY, JSON.stringify(nuovo)); } catch (e) { toast('Spazio del browser esaurito: non riesco a salvare il listino.'); return; }
 loadListino();
 for (const [c, a] of Object.entries(D.assortimento)) { const p = prodotto(c); if (p) { a.prezzo = p.prezzo; a.nome = p.nome; } }
 save(); listinoInArrivo = null; closeDlg(); toast('Listino aggiornato.'); render();
}

  'copia-ordine': async () => { const t = testoOrdine(ordineAperto()); try { await navigator.clipboard.writeText(t); toast('Ordine copiato: incollalo dove ti serve.'); } catch (err) { openDlg('Testo dell’ordine', `<textarea style="width:100%;min-height:300px">${esc(t)}</textarea>`); } },
  stampa: () => window.print(),
  'del-art': () => { const a = D.articoli.find(x => x.id === id); if (a && confirm('Eliminare «' + a.nome + '»?')) { D.articoli = D.articoli.filter(x => x.id !== id); save(); render(); } },
  'attiva-gv': () => { const p = D.gratta.find(x => x.id === id); p.attivato = today(); save(); toast('Pacchetto attivato.'); render(); },
  'chiudi-gv': () => { const p = D.gratta.find(x => x.id === id); const r = p.biglietti - vendutiGratta(p.id); if (r > 0 && !confirm(`Restano ${r} biglietti: chiudere comunque il pacchetto (es. reso)?`)) return; p.chiuso = today(); save(); render(); },
  'riapri-gv': () => { const p = D.gratta.find(x => x.id === id); delete p.chiuso; save(); render(); },
  cliente: () => dlgCliente(id),
  'del-lib': () => { if (!confirm('Eliminare questa riga del libretto?')) return; D.libretto = D.libretto.filter(x => x.id !== id); save(); dlgCliente(b.dataset.cli); },
  'del-cli': () => { if (confirm('Eliminare il cliente?')) { D.clienti = D.clienti.filter(c => c.id !== id); D.libretto = D.libretto.filter(x => x.cli !== id); save(); closeDlg(); } },
  periodo: () => { periodo = {tipo:id, da:periodo.da, a:periodo.a}; render(); },
  csv: esportaCSV,
  backup: () => { D.negozio.ultimoBackup = today(); save(); scarica(`tabaccheria_copia_${today()}.json`, JSON.stringify(D), 'application/json'); render(); },
  'del-ferie': () => { D.negozio.ferie = D.negozio.ferie.filter(f => f.id !== id); save(); render(); },
  reset: () => { if (prompt('Per cancellare tutto scrivi CANCELLA') === 'CANCELLA') { D = defaults(); localStorage.removeItem(LKEY); loadListino(); save(); conto = []; render(); toast('Dati cancellati.'); } }
 };
 if (A[act]) { e.preventDefault(); A[act](); }
});
document.addEventListener('change', e => {
 const t = e.target;
 if (t.name === 'pag' && t.closest('.conto')) { leggiLinea(); lineaTmp.pag = t.value; render(); return; }
 if (t.name === 'cliente' && t.closest('.conto')) { lineaTmp.cliente = t.value; return; }
 if (t.name === 'fuori' && t.closest('.conto')) { lineaTmp.fuori = t.checked; return; }
 if (t.name === 'art' && t.closest('#linea')) { leggiLinea(); render(); return; }
 if (t.dataset.tab) { const a = D.assortimento[t.dataset.tab], v = int(t.value); if (a && v != null) { a[t.dataset.f] = t.dataset.f === 'multiplo' ? Math.max(1, v) : v; save(); render(); } else t.value = a?.[t.dataset.f] ?? ''; return; }
 if (t.dataset.ord != null) { const r = ordineAperto().righe[+t.dataset.ord], v = int(t.value); if (r && v != null && v >= 0) { r.qta = v; save(); render(); } return; }
 if (t.dataset.arr != null) { const r = ordineAperto().righe[+t.dataset.arr], v = int(t.value); if (r && v != null && v >= 0) { r.arrivati = v; save(); } return; }
 if (t.dataset.art) { const a = D.articoli.find(x => x.id === t.dataset.art), f = t.dataset.f; if (!a) return; if (f === 'prezzo' || f === 'costo') a[f] = cents(t.value); else if (f === 'scorta' || f === 'minimo') { const v = int(t.value); if (v != null) a[f] = v; } else if (f === 'nome') a.nome = t.value.trim() || a.nome; else a[f] = t.value; save(); render(); }
});
document.addEventListener('keydown', e => {
 if (e.key === 'Enter' && e.target.closest('#linea') && e.target.id !== 'tab-cerca' && e.target.tagName !== 'SELECT') { e.preventDefault(); aggiungiLinea(); }
});
document.addEventListener('submit', e => {
 const f = e.target, k = f.dataset.form; if (!k) return; e.preventDefault();
 const v = n => f.elements[n]?.value?.trim() ?? '';
 if (k === 'prom') { D.promemoria.push({id:uid(), testo:v('testo'), data:v('data') || null, fatto:false}); }
 else if (k === 'nuovo-art') { D.articoli.push({id:uid(), nome:v('nome'), rep:v('rep'), prezzo:cents(v('prezzo')), costo:null, scorta:int(v('scorta')) || 0, minimo:0}); }
 else if (k === 'nuovo-gv') { const pr = cents(v('prezzo')), bi = int(v('biglietti')); if (!pr || !bi || bi <= 0) { toast('Controlla prezzo e numero di biglietti.'); return; } D.gratta.push({id:uid(), nome:v('nome'), prezzo:pr, biglietti:bi, lotto:v('lotto'), ricevuto:v('ricevuto') || today(), attivato:f.elements.attiva.checked ? today() : null}); toast('Pacchetto aggiunto.'); }
 else if (k === 'nuovo-cli') { if (D.clienti.some(c => norm(c.nome) === norm(v('nome')))) { toast('Esiste già un cliente con questo nome.'); return; } D.clienti.push({id:uid(), nome:v('nome'), tel:v('tel'), note:v('note')}); }
 else if (k === 'pag-cli' || k === 'deb-cli') { const imp = cents(v('imp')); if (!imp || imp <= 0) { toast('Scrivi l’importo.'); return; } D.libretto.push(k === 'pag-cli' ? {id:uid(), t:new Date().toISOString(), cli:f.dataset.id, imp:-imp, via:v('via')} : {id:uid(), t:new Date().toISOString(), cli:f.dataset.id, imp, desc:v('desc') || 'Debito'}); save(); toast(k === 'pag-cli' ? 'Pagamento registrato.' : 'Debito aggiunto.'); dlgCliente(f.dataset.id); return; }
 else if (k === 'mod-cli') { const c = D.clienti.find(x => x.id === f.dataset.id); Object.assign(c, {nome:v('nome') || c.nome, tel:v('tel'), note:v('note')}); save(); toast('Salvato.'); dlgCliente(c.id); return; }
 else if (k === 'negozio') {
  const n = D.negozio; n.nome = v('nome') || n.nome; n.orari = [[v('o0a'), v('o0c')], [v('o1a'), v('o1c')]].filter(([a, c]) => a && c);
  n.chiusoGiorni = [...f.querySelectorAll('[name=chiuso]:checked')].map(x => +x.value); n.giornoOrdine = +v('giornoOrdine'); n.giornoConsegna = +v('giornoConsegna');
  n.prezzoCopia = cents(v('prezzoCopia')) ?? n.prezzoCopia; n.prezzoStampa = cents(v('prezzoStampa')) ?? n.prezzoStampa;
  for (const a of ['tabacchi','gratta','lotto','ricariche']) { const x = parseFloat(v('aggio_' + a).replace(',', '.')); if (isFinite(x)) n.aggi[a] = x; }
  toast('Impostazioni salvate.');
 }
 else if (k === 'ferie') { if (v('al') < v('dal')) { toast('La data finale viene prima di quella iniziale.'); return; } D.negozio.ferie.push({id:uid(), dal:v('dal'), al:v('al'), nota:v('nota')}); }
 else if (k === 'conta-distr') {
  const linee = [], data = v('__data') || today(), t = data === today() ? new Date().toISOString() : new Date(data + 'T20:00:00').toISOString();
  for (const [c, a] of Object.entries(D.assortimento)) { const x = int(f.elements['c_' + c]?.value); if (x == null) continue; const venduti = a.distr - x; if (venduti > 0) linee.push({rep:'tabacchi', cod:c, qta:venduti, prezzoU:prezzoTab(c), imp:venduti * prezzoTab(c), desc:nomeTab(c)}); else if (venduti < 0) a.distr = x; }
  if (linee.length) { registraMovimenti(linee, {pag:'distributore', da:'distributore', t}); toast(`Registrate le vendite del distributore: ${eur(linee.reduce((s, l) => s + l.imp, 0))}`); } else toast('Nessuna vendita da registrare.');
  save(); closeDlg(); return;
 }
 else if (k === 'ricarica-distr') {
  let n = 0; for (const [c, a] of Object.entries(D.assortimento)) { const x = int(f.elements['c_' + c]?.value); if (x && x > 0) { a.banco -= x; a.distr += x; n += x; } }
  save(); toast(n ? `Spostati ${n} pezzi nel distributore.` : 'Nessun pezzo spostato.'); closeDlg(); return;
 }
 save(); render();
});

/* ============ Avvio ============ */
route();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
